name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip -q red_lookup_project.zip -d app
          ls -la app

      - name: Patch text type for newer pdfrx
        run: |
          sed -i 's/final PdfPageText? text = await page.loadText();/final text = await page.loadText();/' app/lib/reader_page.dart
          grep -n "loadText" app/lib/reader_page.dart

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build WordNet dictionary database
        working-directory: app
        run: python tools/build_dictionary.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project files
        working-directory: app
        run: |
          mkdir -p /tmp/scaffold
          (cd /tmp/scaffold && flutter create --project-name red_lookup --org com.redlookup --platforms=android red_lookup)
          cp -r /tmp/scaffold/red_lookup/android android
          sed -i 's/android:label="[^"]*"/android:label="Red Lookup"/' android/app/src/main/AndroidManifest.xml

      - name: Force compileSdk 36 for all plugins
        working-directory: app/android
        run: |
          if [ -f build.gradle.kts ]; then
          cat >> build.gradle.kts <<'EOF'

          subprojects {
              val fixSdk: (Project) -> Unit = { p ->
                  val ext = p.extensions.findByName("android")
                  if (ext != null) {
                      ext.javaClass.getMethod("compileSdkVersion", Int::class.java).invoke(ext, 36)
                  }
              }
              if (state.executed) fixSdk(this) else afterEvaluate { fixSdk(this) }
          }
          EOF
          else
          cat >> build.gradle <<'EOF'

          subprojects {
              def fixSdk = { p -> if (p.hasProperty('android')) { p.android.compileSdkVersion 36 } }
              if (project.state.executed) { fixSdk(project) } else { afterEvaluate { fixSdk(project) } }
          }
          EOF
          fi
          ls
          
      - name: Get packages
        working-directory: app
        run: flutter pub get

      - name: Build APK
        working-directory: app
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: RedLookup-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
